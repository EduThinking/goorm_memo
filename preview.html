<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Goorm 메모 · 포스트잇</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4a18f;color:#795b64;font:14px 'Segoe UI',sans-serif}button,input,textarea{font:inherit}.app{height:100vh;min-height:640px;display:flex;flex-direction:column}.top{background:#fff1ea;height:68px;display:flex;align-items:center;gap:15px;padding:0 25px}.brand{font-size:20px;font-weight:750;color:#d66589;background:none;border:0;padding:0;cursor:pointer}.brand:focus-visible{outline:2px solid #d66589;outline-offset:5px;border-radius:4px}.tagline{font-size:12px;color:#ad8087}.search{margin-left:auto;background:white;border:1px solid #f1c7bd;border-radius:18px;padding:10px 17px;width:270px}.new{background:#e97f9f;color:white;border:0;border-radius:18px;padding:11px 17px;font-weight:700;cursor:pointer}.body{display:flex;flex:1;min-height:0}.rail{width:205px;background:#fff1ea;padding:24px 14px;display:flex;flex-direction:column}.rail h2{font-size:12px;color:#d76688;margin:0 9px 22px}.rail p{font-size:11px;color:#bb8993;margin:0 10px 9px}.rail button{background:transparent;border:0;text-align:left;color:#9b7983;padding:11px 13px;border-radius:14px;cursor:pointer;margin:2px 0}.rail button:hover,.rail button.active{background:#ffdae1;color:#bf567b;font-weight:700}.rail .bottom{margin-top:auto;display:grid}.board{flex:1;overflow:auto;padding:28px 34px}.board h1{color:white;font-size:28px;margin:0}.board .subtitle{color:#fff8f5;margin:5px 0 28px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:23px;max-width:1150px}.card{height:250px;border-radius:13px;background:#fffdfa;box-shadow:0 11px 20px #b4616060;position:relative;padding:19px;border:1px solid #ffe3dc;cursor:pointer;overflow:hidden;transition:transform .15s}.card:hover{transform:translateY(-5px) rotate(-1deg)}.card:before{content:"";position:absolute;left:0;right:0;top:0;height:11px;background:radial-gradient(circle,#ec88a6 2px,transparent 3px) 0 0/36px 11px,radial-gradient(circle,#8bc5d0 2px,transparent 3px) 14px 3px/42px 11px}.card h3{margin:15px 0 13px;font-size:17px;color:#886069}.card p{font-size:13px;line-height:1.65;color:#9b7b82}.kind{display:inline-block;background:#8bc5d0;color:white;padding:5px 12px;border-radius:15px;font-size:11px;font-weight:700}.date{position:absolute;bottom:15px;right:18px;color:#c28d99;font-size:11px}.deco{position:absolute;bottom:13px;left:17px;color:#e97f9f;font-size:23px}.card:nth-child(2){background:#e3f2ef}.card:nth-child(2) .kind{background:#eb8da9}.card:nth-child(3){background:#ffe5df}.card:nth-child(3) .kind{background:#f09b86}.card:nth-child(4){background:#fff1e5}.card:nth-child(5){background:#fce8f1}.card:nth-child(6){background:#e8f3f6}.add{display:flex;align-items:center;justify-content:center;border:2px dashed #fff4ed;background:#ffffff33;color:white;font-size:18px;font-weight:700}.overlay{position:fixed;inset:0;background:#714c5a70;display:none;align-items:center;justify-content:center;padding:20px}.overlay.show{display:flex}.modal{width:min(610px,95vw);background:#fff7f3;border:1px solid #fff;border-radius:21px;padding:25px;box-shadow:0 25px 60px #784d5560}.modal h2{margin:0 0 17px;color:#ce6688}.modal input,.modal textarea,.modal select{width:100%;border:1px solid #efc9c2;background:white;border-radius:12px;padding:13px;outline:none;color:#795b64}.modal select{margin-top:12px}.modal textarea{height:190px;resize:vertical;margin-top:12px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}.actions button{border:0;border-radius:12px;padding:9px 17px;cursor:pointer}.save{background:#e987a4;color:white}@media(max-width:800px){.rail{width:155px}.board{padding:20px}.tagline{display:none}.search{width:170px}}
.empty{grid-column:1/-1;color:white;font-size:17px;padding:55px 12px;text-align:center}.modal-error{color:#c1466a;font-size:12px;min-height:18px;margin-top:6px}.checklist-editor{margin-top:12px;min-height:190px}.checklist-editor[hidden]{display:none}.check-row{display:flex;align-items:center;gap:9px;margin:8px 0}.check-row input[type=checkbox]{width:19px;height:19px;accent-color:#e987a4}.check-row input[type=text]{flex:1;margin:0}.check-row button,.add-item{border:0;border-radius:9px;background:#ffe1e8;color:#bd557b;padding:8px 10px;cursor:pointer}.card .check-preview{display:flex;align-items:center;gap:7px;margin:5px 0;color:#8b7078;font-size:12px}.card .check-preview input{accent-color:#e987a4}.card .check-preview.done span{text-decoration:line-through;opacity:.6}.card-delete{position:absolute;top:16px;right:15px;border:0;background:#fff3f5;color:#c46b84;border-radius:9px;width:30px;height:30px;cursor:pointer;font-size:15px}.card-delete:hover{background:#ffd5e0}.actions #delete{margin-right:auto;background:#ffe1e8;color:#b65075}.actions #delete[hidden]{display:none}</style></head>
<body><div class="app"><header class="top"><button class="brand" id="home" type="button" aria-label="전체 포스트잇으로 돌아가기">✿ Goorm 메모</button><div class="tagline">나만의 작은 기록장</div><input class="search" id="search" placeholder="메모 검색..."><button class="new" id="new">＋ 새 포스트잇</button></header><div class="body"><aside class="rail"><h2>MY NOTEBOOK ♡</h2><p>내 포스트잇</p><button class="active" data-filter="전체">✿ 전체 <span id="count-all">0</span></button><button data-filter="메모">✎ 메모 <span id="count-memo">0</span></button><button data-filter="할 일">☑ 할 일 <span id="count-task">0</span></button><button data-filter="코드">⌘ 코드 <span id="count-code">0</span></button><button data-filter="링크">↗ 링크 <span id="count-link">0</span></button><button data-filter="미분류">◌ 미분류 <span id="count-other">0</span></button><div class="bottom"><button id="export">JSON 내보내기</button></div></aside><main class="board"><h1>전체 포스트잇 ✿</h1><p class="subtitle">작은 생각들을 모아 두는 곳</p><div class="grid" id="grid"></div></main></div></div><div class="overlay" id="overlay"><div class="modal"><h2>✿ 새 포스트잇</h2><input id="note-title" placeholder="제목 (선택)"><textarea id="note-body" placeholder="여기에 작은 생각을 적어 주세요..."></textarea><div id="checklist-editor" class="checklist-editor" hidden><div id="checklist-rows"></div><button type="button" id="add-item" class="add-item">＋ 할 일 추가</button></div><select id="note-type" aria-label="포스트잇 분류"><option value="메모">메모</option><option value="할 일">할 일</option><option value="코드">코드</option><option value="링크">링크</option><option value="미분류">미분류</option></select><div class="modal-error" id="modal-error"></div><div class="actions"><button id="delete" type="button" hidden>🗑 삭제</button><button id="cancel">취소</button><button class="save" id="save">저장</button></div></div></div><script src="preview.js"></script></body></html>
